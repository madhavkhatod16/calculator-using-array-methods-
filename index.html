<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BODMAS Calculator</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
			body{
				background: linear-gradient(135deg, #0f172a, #1e293b);
				display: flex;
				justify-content: center;
				align-items: center;
				font-family: Arial, sans-serif;
				min-height: 100vh;
				margin: 0;
				padding: 10px;
				box-sizing: border-box;
			}
			.calculator{
				width: 100%;
				max-width: 360px;
				background: #1C222B;
				padding: 20px;
				border-radius: 25px;
				box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
			}
			h3{
				color: white;
				text-align: center;
				margin-bottom: 15px;
			}
			#display{
				height: 70px;
				font-size: 32px;
				text-align: right;
				border-radius: 15px;
				margin-bottom: 15px;
				background: #e5e7eb;
				color: #111827;
				font-weight: bold;
			}
			button{
				height: 60px;
				font-size: 22px;
				font-weight: bold;
				border-radius: 15px;
			}
			.num{
				background: #f8fafc;
			}
			.op{
				background: #fb923c;
				color: white;
			}
			.equal{
				background: #22c55e;
				color: white;
			}
			.clear{
				background: #ef4444;
				color: white;
			}
			.del{
				background: #f59e0b;
				color: white;
			}
			.num:hover {
				background: #e2e8f0;
			}
			.op:hover {
				background: #ea580c;
			}
			.equal:hover { 
				background: #16a34a;
			}
			.clear:hover { 
				background: #dc2626;
			}
			.del:hover { 
				background: #d97706;
			}
	</style>
</head>
<body>
<div class="calculator">
		<input type="text" id="display" class="form-control" readonly>
		<div class="row g-2">
			<div class="col-3">
			<button class="btn clear w-100" id="clearBtn">C</button>
			</div>
			<div class="col-3">
			<button class="btn del w-100" id="delBtn">DEL</button>
			</div>
			<div class="col-3">
			<button class="btn op w-100" id="mod">%</button>
			</div>
			<div class="col-3">
			<button class="btn op w-100" id="div">/</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn7">7</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn8">8</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn9">9</button>
			</div>
			<div class="col-3">
			<button class="btn op w-100" id="mul">x</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn4">4</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn5">5</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn6">6</button>
			</div>
			<div class="col-3">
			<button class="btn op w-100" id="minus">-</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn1">1</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn2">2</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="btn3">3</button>
			</div>
			<div class="col-3">
			<button class="btn op w-100" id="plus">+</button>
			</div>
			<div class="col-6">
			<button class="btn num w-100" id="btn0">0</button>
			</div>
			<div class="col-3">
			<button class="btn num w-100" id="dot">.</button>
			</div>
			<div class="col-3">
			<button class="btn equal w-100" id="equalBtn">=</button>
			</div>
		</div>
</div>
<script>
let a = [];
let b = document.getElementById("display");
		function addValue(c){
			a.push(c);
			b.value = a.join("");
		}
		function clearAll(){
			a = [];
			b.value = "";
		}
		function deleteLast(){
			a.pop();
			b.value = a.join("");
		}
function calculate() {
    let expression = a.join("");
    let numbers = expression.split(/[+\-x/%]/).map(Number);
    let operators = expression.split("").filter(op => ["+", "-", "x", "/", "%"].includes(op));
    if (expression === "" || operators.length >= numbers.length){
        b.value = "Error";
        a = [];
        return;
    }
    for (let i = 0; i < operators.length; i++) {
        let op = operators[i];
        if (op === "x" || op === "/" || op === "%") {
            let result = 0;
            if (op === "x") {
			result = numbers[i] * numbers[i + 1];
			}
            if (op === "/"){
			result = numbers[i] / numbers[i + 1];
			}
            if (op === "%"){
			result = numbers[i] % numbers[i + 1];
			}
            numbers.splice(i, 2, result);
            operators.splice(i, 1);
            i--;                          
        }
    }
    let total = numbers[0];
    operators.forEach((op, i) => {
        if (op === "+") total += numbers[i + 1];
        if (op === "-") total -= numbers[i + 1];
    });
    b.value = total;
    a = total.toString().split("");
}
	document.getElementById("btn0").addEventListener("click",function(){addValue("0");});
	document.getElementById("btn1").addEventListener("click",function(){addValue("1");});
	document.getElementById("btn2").addEventListener("click",function(){addValue("2");});
	document.getElementById("btn3").addEventListener("click",function(){addValue("3");});
	document.getElementById("btn4").addEventListener("click",function(){addValue("4");});
	document.getElementById("btn5").addEventListener("click",function(){addValue("5");});
	document.getElementById("btn6").addEventListener("click",function(){addValue("6");});
	document.getElementById("btn7").addEventListener("click",function(){addValue("7");});
	document.getElementById("btn8").addEventListener("click",function(){addValue("8");});
	document.getElementById("btn9").addEventListener("click",function(){addValue("9");});
	document.getElementById("plus").addEventListener("click",function(){addValue("+");});
	document.getElementById("minus").addEventListener("click",function(){addValue("-");});
	document.getElementById("mul").addEventListener("click",function(){addValue("x");});
	document.getElementById("div").addEventListener("click",function(){addValue("/");});
	document.getElementById("mod").addEventListener("click",function(){addValue("%");});
	document.getElementById("dot").addEventListener("click",function(){addValue(".");});
	document.getElementById("clearBtn").addEventListener("click",clearAll);
	document.getElementById("delBtn").addEventListener("click",deleteLast);
	document.getElementById("equalBtn").addEventListener("click",calculate);
</script>
</body>
</html>
